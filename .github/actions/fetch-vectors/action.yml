name: Clone test vectors
description: Clones the wycheproof and x509-limbo repositories

runs:
  using: "composite"

  steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        repository: "C2SP/wycheproof"
        path: "wycheproof"
        # Latest commit on the wycheproof main branch, as of May 21, 2025.
        ref: "4a6c2bf5dc4c0b67c770233ad33961ee653996a0" # wycheproof-ref

    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        repository: "C2SP/x509-limbo"
        path: "x509-limbo"
        # Latest commit on the x509-limbo main branch, as of May 31, 2025.
        ref: "90d7f1aa9fe32a485d5ac26fcfb4ca85415f6f4f" # x509-limbo-ref
